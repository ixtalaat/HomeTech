; HomeTech queue worker — copy to /etc/supervisor/conf.d/hometech-worker.conf
; then run: supervisorctl reread && supervisorctl update && supervisorctl status
;
; Replace /var/www/hometech with the real deploy path and www-data with the
; user PHP runs as. One file serves both purposes below: queue:work keeps
; notifications/mail moving; the cron line (see DEPLOYMENT.md) ticks the
; scheduler every minute for nudges, monitors and pruning.

[program:hometech-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/hometech/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/hometech/storage/logs/worker.log
stopwaitsecs=3600
